<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Writing Planner — Demo</title>

<link rel="stylesheet" href="../frontend/src/styles/global.css">
<link rel="stylesheet" href="../frontend/src/styles/auth.css">
<link rel="stylesheet" href="../frontend/src/styles/dashboard.css">
<link rel="stylesheet" href="../frontend/src/styles/projects.css">
<link rel="stylesheet" href="../frontend/src/styles/project.css">
<link rel="stylesheet" href="../frontend/src/styles/tasks.css">
<link rel="stylesheet" href="../frontend/src/styles/characters.css">

<link rel="stylesheet" href="demo.css">
</head>

<body>
  <div class="demo-banner">
    ✦ You're viewing an interactive demo — this is not the original application.
  </div>

  <main id="app">
    <section class="auth-page">
      <div class="auth-card">
        <div class="auth-brand">
          <span>✦</span>
          <h1>Writing Planner</h1>
        </div>

        <div class="auth-heading">
          <h2>Welcome back</h2>
          <p>Continue working on your stories.</p>
        </div>

        <form class="auth-form" id="login-form">
          <label>
            Email
            <input
              type="email"
              value="demo@writingplanner.com"
              required
            />
          </label>

          <label>
            Password
            <input
              type="password"
              value="demo123"
              required
            />
          </label>

          <p class="auth-error" id="login-error"></p>

          <button
            type="submit"
            class="auth-submit"
          >
            Login
          </button>
        </form>

        <p class="auth-switch">
          Demo account — registration is disabled.
        </p>
      </div>

      <div class="auth-decoration">
        <span>✦</span>
        <span>✧</span>
        <span>·</span>
      </div>
    </section>
  </main>

  <script src="demo.js"></script>
</body>
</html>
